<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FireWatch Pro</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
:root{
  --bg:#0a0f1c;
  --card:#121a2b;
  --accent:#3b82f6;
  --danger:#ef4444;
  --text:#e2e8f0;
}

body{margin:0;font-family:'Segoe UI';background:var(--bg);color:var(--text);display:flex}

.sidebar{width:220px;background:#020617;height:100vh;padding:20px;border-right:1px solid #111827}
.logo{font-size:20px;font-weight:bold;margin-bottom:20px;color:var(--accent)}
.nav-btn{display:block;width:100%;padding:12px;margin-bottom:10px;border:none;border-radius:12px;background:transparent;color:var(--text);cursor:pointer}
.nav-btn:hover{background:var(--accent);color:white}

.main{flex:1;padding:20px}
.header{font-size:24px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.card{background:var(--card);padding:20px;border-radius:20px;box-shadow:0 10px 25px rgba(0,0,0,0.5)}
.metric{margin:5px 0}

.btn{padding:10px;border:none;border-radius:10px;background:var(--accent);color:white;cursor:pointer}
.btn-danger{background:var(--danger)}

.section{display:none}
.active{display:block}

#map{height:400px;border-radius:15px}
</style>
</head>
<body>

<div class="sidebar">
<div class="logo">🔥 FireWatch</div>
<button class="nav-btn" onclick="showPage('dashboard')">Dashboard</button>
<button class="nav-btn" onclick="showPage('mapa')">Mapa</button>
<button class="nav-btn" onclick="showPage('rutas')">Rutas</button>
<button class="nav-btn" onclick="showPage('estadisticas')">Estadísticas</button>
</div>

<div class="main">
<div class="header">Sistema Inteligente de Incendios Forestales</div>

<div id="dashboard" class="section active">
<div class="grid">
<div class="card">
<h2>Sensores</h2>
<p class="metric">Temp: <span id="temp">--</span></p>
<p class="metric">Humo: <span id="smoke">--</span></p>
<p class="metric">Humedad: <span id="humidity">--</span></p>
<p class="metric">Viento: <span id="wind">--</span></p>
<button class="btn" onclick="simulateData()">Simular</button>
</div>

<div class="card">
<h2>IA</h2>
<p>Riesgo: <span id="risk">--</span>%</p>
<p>Evacuación: <span id="evac">--</span></p>
</div>
</div>
</div>

<div id="mapa" class="section">
<div class="card">
<h2>Mapa</h2>
<div id="map"></div>
</div>
</div>

<div id="rutas" class="section">
<div class="card">
<h2>Ruta en tiempo real</h2>
<button class="btn-danger" onclick="generateRoute()">Generar Ruta</button>
</div>
</div>

<div id="estadisticas" class="section">
<div class="card">
<h2>Estadísticas avanzadas</h2>
<canvas id="chart"></canvas>
</div>
</div>

</div>

<script>
let map,chart,fireMarker,routeLine;

function showPage(id){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');

  // FIX CRASH MAPA
  if(id === 'mapa' && map){
    setTimeout(()=>{
      map.invalidateSize();
    },200);
  }
}

function initMap(){
map=L.map('map').setView([20.6,-103.3],6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
}

function simulateData(){
let t=r(60),s=r(500),h=r(100),w=r(50);
set('temp',t);set('smoke',s);set('humidity',h);set('wind',w);
let risk=Math.floor(t*0.4+s*0.3+(100-h)*0.2+w*0.1);
set('risk',risk);
set('evac',risk>70?'SI':'NO');

if(risk>70){
createFire();
}

updateChart(t,s);
}

function createFire(){
  let lat=20+Math.random()*5;
  let lng=-103+Math.random()*5;

  // eliminar incendio anterior
  if(fireMarker) map.removeLayer(fireMarker);

  fireMarker=L.marker([lat,lng]).addTo(map)
    .bindPopup("🔥 Incendio detectado")
    .openPopup();

  // eliminar ruta anterior si existe
  if(routeLine) {
    map.removeLayer(routeLine);
    routeLine = null;
  }
}

function generateRoute(){
  if(!fireMarker){
    alert('⚠️ Primero debes simular un incendio');
    return;
  }

  showPage('mapa');

  setTimeout(()=>{
    let start=[20.6,-103.3];
    let end=fireMarker.getLatLng();

    // limpiar ruta anterior
    if(routeLine) map.removeLayer(routeLine);

    routeLine=L.polyline([start,[end.lat,end.lng]],{
      color:'red',
      weight:5
    }).addTo(map);

    map.fitBounds(routeLine.getBounds());
  },200);
}

  // Cambiar automáticamente al mapa
  showPage('mapa');

  setTimeout(()=>{
    let start=[20.6,-103.3]; // base de bomberos
    let end=fireMarker.getLatLng();

    if(routeLine) map.removeLayer(routeLine);

    routeLine=L.polyline([start,[end.lat,end.lng]],{
      color:'red',
      weight:5
    }).addTo(map);

    // Marcador de inicio
    L.marker(start).addTo(map).bindPopup('🚒 Estación de bomberos');

    map.fitBounds(routeLine.getBounds());
  },300);
}).addTo(map);
map.fitBounds(routeLine.getBounds());
}

function updateChart(t,s){
  if(!chart){
    chart=new Chart(document.getElementById('chart'),{
      type:'bar',
      data:{labels:[],datasets:[{label:'Temp',data:[]},{label:'Humo',data:[]}]} ,
      options:{animation:false}
    });
  }

  // LIMITAR DATOS (EVITA FREEZE)
  if(chart.data.labels.length > 10){
    chart.data.labels.shift();
    chart.data.datasets[0].data.shift();
    chart.data.datasets[1].data.shift();
  }

  chart.data.labels.push(new Date().toLocaleTimeString());
  chart.data.datasets[0].data.push(t);
  chart.data.datasets[1].data.push(s);
  chart.update();
},{label:'Humo',data:[]}]} });}
chart.data.labels.push(new Date().toLocaleTimeString());
chart.data.datasets[0].data.push(t);
chart.data.datasets[1].data.push(s);
chart.update();
}

function r(max){return Math.floor(Math.random()*max)}
function set(id,v){document.getElementById(id).textContent=v}

window.onload=initMap;
</script>

</body>
</html>
