<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FireWatch Pro</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
:root{
  --bg:#020617;
  --card:#0f172a;
  --accent:#22c55e;
  --accent2:#ef4444;
  --text:#e5e7eb;
}

body{margin:0;font-family:'Segoe UI';background:var(--bg);color:var(--text);display:flex}

/* SIDEBAR */
.sidebar{
  width:220px;
  background:#020617;
  height:100vh;
  padding:20px;
  border-right:1px solid #111827;
}

.logo{
  font-size:20px;
  font-weight:bold;
  margin-bottom:20px;
  color:var(--accent);
}

.nav-btn{
  display:block;
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border:none;
  border-radius:12px;
  background:transparent;
  color:var(--text);
  text-align:left;
  cursor:pointer;
  transition:.2s;
}

.nav-btn:hover{
  background:var(--accent);
  color:black;
}

/* MAIN */
.main{flex:1;padding:20px}

.header{
  font-size:24px;
  margin-bottom:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:20px;
}

.card{
  background:var(--card);
  padding:20px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.5);
}

.card h2{margin-top:0}

.metric{
  font-size:18px;
  margin:5px 0;
}

.btn{
  padding:10px 15px;
  border:none;
  border-radius:10px;
  background:linear-gradient(45deg,var(--accent),#4ade80);
  color:black;
  font-weight:bold;
  cursor:pointer;
  margin-top:10px;
}

.btn-danger{
  background:linear-gradient(45deg,var(--accent2),#f87171);
  color:white;
}

.section{display:none}
.active{display:block}

#map{height:400px;border-radius:15px}

.badge{
  padding:5px 10px;
  border-radius:10px;
  background:#111827;
  font-size:12px;
}

</style>
</head>
<body>

<div class="sidebar">
  <div class="logo">🔥 FireWatch</div>
  <button class="nav-btn" onclick="showPage('dashboard')">Dashboard</button>
  <button class="nav-btn" onclick="showPage('mapa')">Mapa</button>
  <button class="nav-btn" onclick="showPage('rutas')">Rutas</button>
  <button class="nav-btn" onclick="showPage('estadisticas')">Estadísticas</button>
  <button class="nav-btn" onclick="showPage('encuestas')">Encuestas</button>
</div>

<div class="main">
<div class="header">Sistema Inteligente de Incendios Forestales</div>

<!-- DASHBOARD -->
<div id="dashboard" class="section active">
<div class="grid">

<div class="card">
<h2>Sensores</h2>
<div class="metric">🌡️ Temp: <span id="temp">--</span></div>
<div class="metric">💨 Humo: <span id="smoke">--</span></div>
<div class="metric">💧 Humedad: <span id="humidity">--</span></div>
<div class="metric">🌬️ Viento: <span id="wind">--</span></div>
<button class="btn" onclick="simulateData()">Simular Datos</button>
</div>

<div class="card">
<h2>IA</h2>
<p>Riesgo: <span class="badge" id="risk">--</span>%</p>
<p>Evacuación: <span class="badge" id="evac">--</span></p>
</div>

</div>
</div>

<!-- MAPA -->
<div id="mapa" class="section">
<div class="card">
<h2>Mapa en Tiempo Real</h2>
<div id="map"></div>
</div>
</div>

<!-- RUTAS -->
<div id="rutas" class="section">
<div class="card">
<h2>Rutas de Emergencia</h2>
<p id="route">--</p>
<button class="btn-danger" onclick="generateRoute()">Generar Ruta</button>
</div>
</div>

<!-- ESTADISTICAS -->
<div id="estadisticas" class="section">
<div class="card">
<h2>Estadísticas</h2>
<canvas id="chart"></canvas>
</div>
</div>

<!-- ENCUESTAS -->
<div id="encuestas" class="section">
<div class="card">
<h2>Encuesta</h2>
<p>¿El sistema ayuda a prevenir incendios?</p>
<button class="btn" onclick="alert('Respuesta registrada')">Sí</button>
<button class="btn-danger" onclick="alert('Respuesta registrada')">No</button>
</div>
</div>

</div>

<script>
let map,chart;

function showPage(id){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function initMap(){
  map=L.map('map').setView([20.6,-103.3],6);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
}

function simulateData(){
  let t=r(60),s=r(500),h=r(100),w=r(50);
  set('temp',t);set('smoke',s);set('humidity',h);set('wind',w);
  let risk=Math.floor(t*0.4+s*0.3+(100-h)*0.2+w*0.1);
  set('risk',risk);
  set('evac',risk>70?'SI':'NO');
  updateChart(t,s);
}

function updateChart(t,s){
  if(!chart){chart=new Chart(document.getElementById('chart'),{type:'line',data:{labels:[],datasets:[{label:'Temp',data:[]},{label:'Humo',data:[]}]} });}
  chart.data.labels.push(new Date().toLocaleTimeString());
  chart.data.datasets[0].data.push(t);
  chart.data.datasets[1].data.push(s);
  chart.update();
}

function generateRoute(){
  document.getElementById('route').textContent='Ruta óptima generada correctamente';
}

function r(max){return Math.floor(Math.random()*max)}
function set(id,v){document.getElementById(id).textContent=v}

window.onload=initMap;
</script>

</body>
</html>
