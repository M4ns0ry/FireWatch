<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FireWatch Pro</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<style>
body{margin:0;font-family:'Segoe UI';background:#020617;color:white}
header{background:#111827;padding:15px;text-align:center;font-size:22px;color:#22c55e}
nav{display:flex;justify-content:center;gap:10px;background:#020617;padding:10px}
nav button{padding:10px 15px;border:none;border-radius:10px;background:#1f2937;color:white;cursor:pointer}
nav button:hover{background:#22c55e;color:black}
.section{display:none;padding:20px}
.active{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.card{background:#1f2937;padding:20px;border-radius:15px}
#map{height:400px}
</style>
</head>
<body>
<header>🔥 FireWatch Sistema Profesional</header>

<nav>
<button onclick="showPage('dashboard')">Dashboard</button>
<button onclick="showPage('mapa')">Mapa</button>
<button onclick="showPage('rutas')">Rutas</button>
<button onclick="showPage('estadisticas')">Estadísticas</button>
<button onclick="showPage('encuestas')">Encuestas</button>
</nav>

<!-- DASHBOARD -->
<div id="dashboard" class="section active">
<div class="grid">
<div class="card">
<h2>Sensores</h2>
<p>Temp: <span id="temp">--</span></p>
<p>Humo: <span id="smoke">--</span></p>
<p>Humedad: <span id="humidity">--</span></p>
<p>Viento: <span id="wind">--</span></p>
<button onclick="simulateData()">Simular</button>
</div>

<div class="card">
<h2>IA</h2>
<p>Riesgo: <span id="risk">--</span>%</p>
<p>Evacuación: <span id="evac">--</span></p>
</div>
</div>
</div>

<!-- MAPA -->
<div id="mapa" class="section">
<h2>Mapa de Incendios</h2>
<div id="map"></div>
</div>

<!-- RUTAS -->
<div id="rutas" class="section">
<h2>Rutas de emergencia</h2>
<p id="route">--</p>
<button onclick="generateRoute()">Generar Ruta</button>
</div>

<!-- ESTADISTICAS -->
<div id="estadisticas" class="section">
<h2>Estadísticas</h2>
<canvas id="chart"></canvas>
</div>

<!-- ENCUESTAS -->
<div id="encuestas" class="section">
<h2>Encuesta</h2>
<p>¿Consideras importante este sistema?</p>
<button onclick="alert('Gracias por tu respuesta')">Sí</button>
<button onclick="alert('Gracias por tu respuesta')">No</button>
</div>

<script>
let map,chart;

function showPage(id){
document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
document.getElementById(id).classList.add('active');
}

function initMap(){
map=L.map('map').setView([20.6,-103.3],6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
}

function simulateData(){
let t=r(60),s=r(500),h=r(100),w=r(50);
set('temp',t);set('smoke',s);set('humidity',h);set('wind',w);
let risk=Math.floor(t*0.4+s*0.3+(100-h)*0.2+w*0.1);
set('risk',risk);
set('evac',risk>70?'SI':'NO');
updateChart(t,s);
}

function updateChart(t,s){
if(!chart){chart=new Chart(document.getElementById('chart'),{type:'line',data:{labels:[],datasets:[{label:'Temp',data:[]},{label:'Humo',data:[]}]} });}
chart.data.labels.push(new Date().toLocaleTimeString());
chart.data.datasets[0].data.push(t);
chart.data.datasets[1].data.push(s);
chart.update();
}

function generateRoute(){
document.getElementById('route').textContent='Ruta generada correctamente';
}

function r(max){return Math.floor(Math.random()*max)}
function set(id,v){document.getElementById(id).textContent=v}

window.onload=initMap;
</script>
</body>
</html>
