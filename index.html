<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FireWatch Pro</title>

<!-- LIBRERÍAS -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
:root{
  --bg:#000000;
  --card:#0f0f0f;
  --accent:#ff1a1a;
  --danger:#b30000;
  --text:#f5f5f5;
}

body{margin:0;font-family:'Segoe UI';background:var(--bg);color:var(--text);display:flex}

.sidebar{
  width:220px;
  background:#020617;
  height:100vh;
  padding:20px;
}

.logo{font-size:20px;font-weight:bold;margin-bottom:20px;color:var(--accent)}

.nav-btn{
  display:block;
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border:none;
  border-radius:10px;
  background:transparent;
  color:white;
  cursor:pointer;
}

.nav-btn:hover{background:var(--accent)}

.main{flex:1;padding:20px}
.section{display:none}
.active{display:block}

.card{
  background:var(--card);
  padding:20px;
  border-radius:15px;
  margin-bottom:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:20px;
}

button{
  padding:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:var(--accent);
  color:white;
}

.btn-danger{background:var(--danger)}

#map{height:400px;border-radius:10px}
</style>
</head>

<body>

<div class="sidebar">
<div class="logo">🔥 FireWatch</div>
<button class="nav-btn" onclick="showPage('dashboard')">Dashboard</button>
<button class="nav-btn" onclick="showPage('mapa')">Mapa</button>
<button class="nav-btn" onclick="showPage('rutas')">Rutas</button>
<button class="nav-btn" onclick="showPage('estadisticas')">Estadísticas</button>
</div>

<div class="main">

<div id="dashboard" class="section active">
<div class="grid">
<div class="card">
<h2>Sensores</h2>
<p>Temp: <span id="temp">--</span></p>
<p>Humo: <span id="smoke">--</span></p>
<p>Humedad: <span id="humidity">--</span></p>
<p>Viento: <span id="wind">--</span></p>
<button onclick="simulateData()">Simular</button>
</div>

<div class="card">
<h2>IA</h2>
<p>Riesgo: <span id="risk">--</span>%</p>
<p>Evacuación: <span id="evac">--</span></p>
</div>
</div>
</div>

<div id="mapa" class="section">
<div class="card">
<h2>Mapa</h2>
<div id="map"></div>
</div>
</div>

<div id="rutas" class="section">
<div class="card">
<h2>Ruta</h2>
<button class="btn-danger" onclick="generateRoute()">Generar Ruta</button>
</div>
</div>

<div id="estadisticas" class="section">
<div class="card">
<h2>Estadísticas</h2>
<canvas id="chart"></canvas>
</div>
</div>

</div>

<script>
let map, fireMarker=null, routeLine=null, chart=null;
let initialized=false;

function showPage(id){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');

  if(id==='mapa' && map){
    setTimeout(()=>map.invalidateSize(),200);
  }
}

function initMap(){
  if(initialized) return;
  initialized=true;

  map=L.map('map',{preferCanvas:true}).setView([20.6,-103.3],6);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
}

function simulateData(){
  let t=random(60), s=random(500), h=random(100), w=random(50);

  set('temp',t);
  set('smoke',s);
  set('humidity',h);
  set('wind',w);

  let risk=Math.floor(t*0.4+s*0.3+(100-h)*0.2+w*0.1);
  set('risk',risk);
  set('evac',risk>70?'SI':'NO');

  if(risk>70){ createFire(); }

  updateChart(t,s);
}

function createFire(){
  let lat=20+Math.random()*5;
  let lng=-103+Math.random()*5;

  if(fireMarker) map.removeLayer(fireMarker);
  if(routeLine) map.removeLayer(routeLine);

  fireMarker=L.marker([lat,lng]).addTo(map)
    .bindPopup('🔥 Incendio detectado')
    .openPopup();
}

function generateRoute(){
  if(!fireMarker){ alert('Primero simula incendio'); return; }

  showPage('mapa');

  setTimeout(()=>{
    let start=[20.6,-103.3];
    let end=fireMarker.getLatLng();

    if(routeLine) map.removeLayer(routeLine);

    routeLine=L.polyline([start,[end.lat,end.lng]],{color:'red'}).addTo(map);

    map.fitBounds(routeLine.getBounds());
  },200);
}

function updateChart(t,s){
  if(!chart){
    chart=new Chart(document.getElementById('chart'),{
      type:'bar',
      data:{labels:[],datasets:[{label:'Temp',data:[]},{label:'Humo',data:[]}]},
      options:{animation:false}
    });
  }

  if(chart.data.labels.length>10){
    chart.data.labels.shift();
    chart.data.datasets[0].data.shift();
    chart.data.datasets[1].data.shift();
  }

  chart.data.labels.push(new Date().toLocaleTimeString());
  chart.data.datasets[0].data.push(t);
  chart.data.datasets[1].data.push(s);

  chart.update();
}

function random(max){return Math.floor(Math.random()*max)}
function set(id,val){document.getElementById(id).textContent=val}

window.onload=initMap;
</script>

</body>
</html>
